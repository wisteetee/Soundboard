<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: icon:;">
<title>Soundboard — Overlay</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --panel-2: #232428;
    --border: #3f4147; --text: #dbdee1; --text-dim: #949ba4;
    --blurple: #5865f2; --red: #da373c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden;
    font-size: 13px; user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px 7px 12px; background: var(--panel-2);
    -webkit-app-region: drag;   /* toute la barre déplace la fenêtre */
    flex-shrink: 0;
  }
  header .title { flex: 1; font-weight: 600; font-size: 12.5px; overflow: hidden; white-space: nowrap; }
  header button {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; cursor: pointer; padding: 3px 7px; border-radius: 6px;
  }
  header button:hover { background: var(--panel); color: var(--text); }
  header button.stop:hover { background: var(--red); color: #fff; }
  #grid {
    flex: 1; overflow-y: auto; padding: 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px;
    align-content: start;
  }
  #grid::-webkit-scrollbar { width: 6px; }
  #grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .t {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 4px 6px; cursor: pointer; transition: transform .08s, border-color .12s;
  }
  .t:hover { border-color: var(--blurple); }
  .t:active { transform: scale(.93); }
  .t .ico {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; background: var(--panel-2); overflow: hidden;
  }
  .t .ico img { width: 100%; height: 100%; object-fit: cover; }
  .t .nm {
    font-size: 10px; color: var(--text-dim); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .empty { grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 30px 10px; line-height: 1.7; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <span class="title">🎮 Soundboard</span>
    <button id="refresh" title="Rafraîchir">↻</button>
    <button id="stop" class="stop" title="Stopper tous les sons">⏹</button>
    <button id="close" title="Cacher (Ctrl+Alt+O)">✕</button>
  </header>
  <div id="grid"></div>
  <script src="overlay.js"></script>
</body>
</html>
